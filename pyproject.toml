[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pylint==4.1.2",
    "pytest==9.1.1",
]

[project]
name = "game-tools"
version = "1.0.0"
requires-python = ">=3.15"
dependencies = [
    "fsrs==6.3.2",
    "sgfmill==1.1.1",
]

[project.scripts]
game-tools = "game_tools.cli:main"
